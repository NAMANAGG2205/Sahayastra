<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <!-- Background -->
  <rect width="400" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">UML Class Diagram - User</text>
  
  <!-- User Class Box -->
  <rect x="50" y="50" width="300" height="400" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  
  <!-- Class Name -->
  <rect x="50" y="50" width="300" height="40" rx="5" fill="#2980b9"/>
  <text x="200" y="75" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="white">User</text>
  
  <!-- Attributes Section -->
  <line x1="50" y1="90" x2="350" y2="90" stroke="white" stroke-width="1"/>
  <text x="60" y="110" font-family="Arial" font-size="12" fill="white">- _id: String</text>
  <text x="60" y="130" font-family="Arial" font-size="12" fill="white">- username: String</text>
  <text x="60" y="150" font-family="Arial" font-size="12" fill="white">- email: String</text>
  <text x="60" y="170" font-family="Arial" font-size="12" fill="white">- password: String (hashed)</text>
  <text x="60" y="190" font-family="Arial" font-size="12" fill="white">- gender: String</text>
  <text x="60" y="210" font-family="Arial" font-size="12" fill="white">- incomeGroup: String</text>
  <text x="60" y="230" font-family="Arial" font-size="12" fill="white">- state: String</text>
  <text x="60" y="250" font-family="Arial" font-size="12" fill="white">- age: Number</text>
  <text x="60" y="270" font-family="Arial" font-size="12" fill="white">- favorites: Array&lt;String&gt;</text>
  <text x="60" y="290" font-family="Arial" font-size="12" fill="white">- createdAt: Date</text>
  <text x="60" y="310" font-family="Arial" font-size="12" fill="white">- updatedAt: Date</text>
  
  <!-- Methods Section -->
  <line x1="50" y1="320" x2="350" y2="320" stroke="white" stroke-width="1"/>
  <text x="60" y="340" font-family="Arial" font-size="12" fill="white">+ register(): Promise&lt;User&gt;</text>
  <text x="60" y="360" font-family="Arial" font-size="12" fill="white">+ login(): Promise&lt;Token&gt;</text>
  <text x="60" y="380" font-family="Arial" font-size="12" fill="white">+ logout(): Promise&lt;void&gt;</text>
  <text x="60" y="400" font-family="Arial" font-size="12" fill="white">+ updateProfile(): Promise&lt;User&gt;</text>
  <text x="60" y="420" font-family="Arial" font-size="12" fill="white">+ addFavorite(schemeId): void</text>
  <text x="60" y="440" font-family="Arial" font-size="12" fill="white">+ removeFavorite(schemeId): void</text>
</svg>
