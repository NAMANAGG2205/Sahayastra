<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">Level 0 DFD (Context Level)</text>
  
  <!-- User Entity -->
  <rect x="250" y="50" width="100" height="50" rx="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="300" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">USER</text>
  
  <!-- Arrow Down -->
  <line x1="300" y1="100" x2="300" y2="140" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Scheme Seva System -->
  <rect x="150" y="140" width="300" height="80" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="170" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">SAHAYASTRA</text>
  <text x="300" y="190" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">SYSTEM</text>
  
  <!-- Arrow Down -->
  <line x1="300" y1="220" x2="300" y2="260" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Horizontal Line -->
  <line x1="100" y1="260" x2="500" y2="260" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Arrows to databases -->
  <line x1="100" y1="260" x2="100" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="260" x2="300" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="500" y1="260" x2="500" y2="300" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Excel DB -->
  <rect x="30" y="300" width="140" height="60" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="100" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Excel DB</text>
  <text x="100" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Schemes)</text>
  
  <!-- MongoDB -->
  <rect x="230" y="300" width="140" height="60" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="300" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MongoDB</text>
  <text x="300" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Users)</text>
  
  <!-- Gemini AI -->
  <rect x="430" y="300" width="140" height="60" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="500" y="325" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Gemini AI</text>
  <text x="500" y="345" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Chatbot)</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
