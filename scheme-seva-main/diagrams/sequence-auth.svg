<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <!-- Background -->
  <rect width="700" height="450" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#2c3e50">Sequence Diagram - User Authentication</text>
  
  <!-- Actors/Objects -->
  <rect x="50" y="50" width="100" height="40" rx="5" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="100" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">User</text>
  
  <rect x="200" y="50" width="100" height="40" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Frontend</text>
  
  <rect x="350" y="50" width="100" height="40" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Backend</text>
  
  <rect x="500" y="50" width="100" height="40" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="550" y="75" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MongoDB</text>
  
  <!-- Vertical Lines -->
  <line x1="100" y1="90" x2="100" y2="420" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="250" y1="90" x2="250" y2="420" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="400" y1="90" x2="400" y2="420" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="550" y1="90" x2="550" y2="420" stroke="#2c3e50" stroke-width="2" stroke-dasharray="5,5"/>
  
  <!-- Message 1: Login Request -->
  <line x1="100" y1="120" x2="250" y2="120" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="115" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Login Request</text>
  
  <!-- Message 2: POST /login -->
  <line x1="250" y1="150" x2="400" y2="150" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="145" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">POST /login</text>
  
  <!-- Message 3: Find User -->
  <line x1="400" y1="180" x2="550" y2="180" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="475" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Find User</text>
  
  <!-- Message 4: User Data -->
  <line x1="550" y1="210" x2="400" y2="210" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="475" y="205" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">User Data</text>
  
  <!-- Processing box -->
  <rect x="380" y="230" width="40" height="30" rx="3" fill="#f39c12" stroke="#e67e22"/>
  <text x="400" y="250" text-anchor="middle" font-family="Arial" font-size="8" fill="white">Verify</text>
  
  <!-- Message 5: Token -->
  <line x1="400" y1="280" x2="250" y2="280" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Token</text>
  
  <!-- Message 6: Success -->
  <line x1="250" y1="310" x2="100" y2="310" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="305" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Success + Token</text>
  
  <!-- Message 7: Protected Request -->
  <line x1="100" y1="340" x2="250" y2="340" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="335" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">Protected Request</text>
  
  <!-- Message 8: GET /getme -->
  <line x1="250" y1="370" x2="400" y2="370" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="365" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">GET /getme</text>
  
  <!-- Message 9: User Data -->
  <line x1="400" y1="400" x2="250" y2="400" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="325" y="395" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">User Data</text>
  
  <!-- Message 10: Profile -->
  <line x1="250" y1="410" x2="100" y2="410" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="175" y="425" text-anchor="middle" font-family="Arial" font-size="10" fill="#2c3e50">User Profile</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
