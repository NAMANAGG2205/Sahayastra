<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#2c3e50">High-Level System Architecture</text>
  
  <!-- User Interface Box -->
  <rect x="200" y="60" width="400" height="100" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="85" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">USER INTERFACE</text>
  <text x="400" y="105" text-anchor="middle" font-family="Arial" font-size="12" fill="white">(React.js Frontend)</text>
  
  <!-- UI Components -->
  <rect x="220" y="115" width="70" height="30" rx="5" fill="#5dade2" stroke="#3498db"/>
  <text x="255" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Home</text>
  
  <rect x="300" y="115" width="70" height="30" rx="5" fill="#5dade2" stroke="#3498db"/>
  <text x="335" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Schemes</text>
  
  <rect x="380" y="115" width="70" height="30" rx="5" fill="#5dade2" stroke="#3498db"/>
  <text x="415" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Profile</text>
  
  <rect x="460" y="115" width="70" height="30" rx="5" fill="#5dade2" stroke="#3498db"/>
  <text x="495" y="135" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Chatbot</text>
  
  <!-- Arrow Down -->
  <line x1="400" y1="160" x2="400" y2="200" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="185" font-family="Arial" font-size="10" fill="#7f8c8d">HTTP/HTTPS</text>
  <text x="420" y="195" font-family="Arial" font-size="10" fill="#7f8c8d">REST API</text>
  
  <!-- API Gateway Box -->
  <rect x="200" y="200" width="400" height="100" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="225" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">API GATEWAY</text>
  <text x="400" y="245" text-anchor="middle" font-family="Arial" font-size="12" fill="white">(Express.js Server)</text>
  
  <!-- API Components -->
  <rect x="220" y="255" width="70" height="30" rx="5" fill="#ec7063" stroke="#e74c3c"/>
  <text x="255" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Auth</text>
  
  <rect x="300" y="255" width="70" height="30" rx="5" fill="#ec7063" stroke="#e74c3c"/>
  <text x="335" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Scheme</text>
  
  <rect x="380" y="255" width="70" height="30" rx="5" fill="#ec7063" stroke="#e74c3c"/>
  <text x="415" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="white">User</text>
  
  <rect x="460" y="255" width="70" height="30" rx="5" fill="#ec7063" stroke="#e74c3c"/>
  <text x="495" y="275" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Chatbot</text>
  
  <!-- Arrows to databases -->
  <line x1="400" y1="300" x2="400" y2="340" stroke="#2c3e50" stroke-width="2"/>
  <line x1="200" y1="340" x2="600" y2="340" stroke="#2c3e50" stroke-width="2"/>
  
  <line x1="200" y1="340" x2="200" y2="380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="340" x2="400" y2="380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="340" x2="600" y2="380" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Excel DB Box -->
  <rect x="120" y="380" width="160" height="120" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="200" y="405" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Excel DB</text>
  <text x="200" y="425" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Scheme Data)</text>
  <line x1="140" y1="435" x2="260" y2="435" stroke="white" stroke-width="1"/>
  <text x="200" y="455" text-anchor="middle" font-family="Arial" font-size="10" fill="white">300+ Schemes</text>
  <text x="200" y="475" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Static Data</text>
  
  <!-- MongoDB Box -->
  <rect x="320" y="380" width="160" height="120" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="400" y="405" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MongoDB</text>
  <text x="400" y="425" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(User Data)</text>
  <line x1="340" y1="435" x2="460" y2="435" stroke="white" stroke-width="1"/>
  <text x="400" y="455" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Users</text>
  <text x="400" y="475" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Favorites</text>
  
  <!-- Gemini AI Box -->
  <rect x="520" y="380" width="160" height="120" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Gemini AI</text>
  <text x="600" y="425" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Chatbot)</text>
  <line x1="540" y1="435" x2="660" y2="435" stroke="white" stroke-width="1"/>
  <text x="600" y="455" text-anchor="middle" font-family="Arial" font-size="10" fill="white">NLP Engine</text>
  <text x="600" y="475" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Multilingual</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
