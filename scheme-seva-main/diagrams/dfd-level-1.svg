<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="25" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#2c3e50">Level 1 DFD - Sahayastra</text>
  
  <!-- User Entity -->
  <rect x="350" y="50" width="100" height="50" rx="25" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="white">USER</text>
  
  <!-- Arrows from User -->
  <line x1="350" y1="75" x2="200" y2="130" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="100" x2="400" y2="130" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="75" x2="600" y2="130" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Labels on arrows -->
  <text x="250" y="100" font-family="Arial" font-size="10" fill="#7f8c8d">Request Schemes</text>
  <text x="405" y="120" font-family="Arial" font-size="10" fill="#7f8c8d">Query Chatbot</text>
  <text x="500" y="100" font-family="Arial" font-size="10" fill="#7f8c8d">Profile Mgmt</text>
  
  <!-- Process 1: Scheme Search -->
  <rect x="100" y="130" width="200" height="60" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Scheme Search</text>
  <text x="200" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="white">& Filter</text>
  
  <!-- Process 2: Chatbot -->
  <rect x="320" y="130" width="160" height="60" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Chatbot</text>
  <text x="400" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="white">Service</text>
  
  <!-- Process 3: Auth System -->
  <rect x="520" y="130" width="160" height="60" rx="5" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="155" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Auth System</text>
  
  <!-- Arrows to databases -->
  <line x1="200" y1="190" x2="200" y2="250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="400" y1="190" x2="400" y2="250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="600" y1="190" x2="600" y2="250" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Excel DB -->
  <rect x="120" y="250" width="160" height="60" rx="5" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="200" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Excel DB</text>
  <text x="200" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(300 Schemes)</text>
  
  <!-- Gemini AI -->
  <rect x="320" y="250" width="160" height="60" rx="5" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="400" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Gemini AI</text>
  <text x="400" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="white">API</text>
  
  <!-- MongoDB -->
  <rect x="520" y="250" width="160" height="60" rx="5" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="600" y="275" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">MongoDB</text>
  <text x="600" y="295" text-anchor="middle" font-family="Arial" font-size="10" fill="white">(Users)</text>
  
  <!-- Arrows to response -->
  <line x1="200" y1="310" x2="200" y2="350" stroke="#2c3e50" stroke-width="2"/>
  <line x1="400" y1="310" x2="400" y2="350" stroke="#2c3e50" stroke-width="2"/>
  <line x1="600" y1="310" x2="600" y2="350" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Horizontal line -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#2c3e50" stroke-width="2"/>
  
  <!-- Arrow to response -->
  <line x1="400" y1="350" x2="400" y2="390" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Response -->
  <rect x="300" y="390" width="200" height="50" rx="5" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
  <text x="400" y="420" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="white">Response to User</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
